name: Receiver and transport checks

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: foundry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/relay/package-lock.json
      - run: npm ci
      - run: npm ci --prefix services/relay
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix services/relay --audit-level=moderate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:public
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:browser
      - run: npm run package:module
